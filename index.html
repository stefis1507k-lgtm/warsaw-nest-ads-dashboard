<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Warsaw Nest: реклама</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#160a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Warsaw Nest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{--color-fg:#f5f0ff;--color-bg:#160a1a;--font-anthropic-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--font-anthropic-serif:Georgia,serif}
html,body{margin:0;background:#160a1a;color:#f5f0ff;font:14px/1.4 "Manrope",var(--font-anthropic-sans);-webkit-tap-highlight-color:transparent}
body{padding:max(10px,env(safe-area-inset-top)) 10px max(14px,env(safe-area-inset-bottom))}
[hidden]{display:none!important}
#wn-gate{max-width:28rem;margin:20vh auto 0;text-align:center;padding:0 16px}
#wn-gate h1{font:800 26px/1.1 "Playfair Display",Georgia,serif;margin:0 0 10px;color:#f6f1e7}
#wn-gate p{margin:0 0 14px;color:#cdb9d6;font-size:15px}
#wn-gateform{display:grid;gap:10px}
#wn-gatein{font:16px "Manrope",sans-serif;padding:14px;border-radius:14px;border:2px solid #5a3262;background:#2a1330;color:#f6f1e7;width:100%;box-sizing:border-box}
#wn-gateform button{font:800 16px "Manrope",sans-serif;padding:14px;border:0;border-radius:14px;background:#d3a5e8;color:#241129;cursor:pointer}
#wn-gateerr{color:#ff8fb8!important}
#wn-refresh{position:absolute;top:max(10px,env(safe-area-inset-top));right:14px;z-index:5;display:grid;justify-items:end;gap:2px}
#wn-refresh button{font:800 20px/1 "Manrope",sans-serif;width:40px;height:40px;padding:0;border-radius:50%;border:2px solid #d3a5e8;background:rgba(36,17,41,.85);color:#f6f1e7;cursor:pointer;display:grid;place-items:center}
#wn-refresh span{font:500 10px "Manrope",sans-serif;color:#cdb9d6}
</style>
</head>
<body>
<script>
// Дані шифровані. Ключ із посилання (#k=...) запам'ятовується на цьому пристрої.
(function () {
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  let key = null;
  const m = location.hash.match(/k=([A-Za-z0-9_-]{43})/);
  if (m) { key = m[1]; store.set('wn-key', key); history.replaceState(null, '', location.pathname); } else key = store.get('wn-key');
    const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  let D = {};
  window.dash = {
    data: (id) => ({ status: D[id] ? 'ok' : 'missing', data: D[id] || [] }),
    onData: (f) => { window.__fire = f; f(); },
    colors: ['#b57acd', '#6fd8cf', '#d3a5e8', '#5fe0b0'], setLink: () => {}, params: () => ({}), setParams: () => {}, resetParams: () => {}
  };
  async function load() {
    const gate = document.getElementById('wn-gate'), root = document.getElementById('dash-root'), msg = document.getElementById('wn-gatemsg');
    if (!key) { gate.hidden = false; return; }
    try {
      const f = await (await fetch('data.enc', { cache: 'no-cache' })).json();
      const raw = b64(f.ct), iv = b64(f.iv);
      const k = await crypto.subtle.importKey('raw', b64(key), 'AES-GCM', false, ['decrypt']);
      const P = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, k, raw)));
      D = P.data;
      // живі цифри (live.enc) окремим малим файлом: оновлюються щогодини, без повторного завантаження картинок
      try {
        const lr = await fetch('live.enc', { cache: 'no-cache' });
        if (lr.ok) {
          const lf = await lr.json();
          const L = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(lf.iv) }, k, b64(lf.ct))));
          (D.creatives || []).forEach((r) => { const m = L.creatives && L.creatives[r.id]; if (m) Object.assign(r, m); });
          (D.groups || []).forEach((g) => { const m = L.groups && L.groups[g.group]; if (m) Object.assign(g, m); });
          (L.placements || []).forEach((m) => { const p = (D.placements || []).find((x) => x.place === m.place); if (p) Object.assign(p, m); });
          (L.daily || []).forEach((m) => { const d = (D.daily || []).find((x) => x.day === m.day); if (d) Object.assign(d, m); });
          if (L.updated) { const sp = document.querySelector('#wn-refresh span'); if (sp) sp.textContent += ' · дані ' + new Date(L.updated).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Warsaw' }); }
        }
      } catch (e) { /* без живих цифр сторінка працює як раніше */ }
      // статус монітора бота (status.enc): лише кількості, без імен клієнтів
      try {
        const sr = await fetch('status.enc', { cache: 'no-cache' });
        if (sr.ok) { const sf = await sr.json(); D.botstatus = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(sf.iv) }, k, b64(sf.ct)))); }
      } catch (e) { /* без статусу бота лишається довідка */ }
      root.innerHTML = P.page.replace(/<script[\s\S]*?<\/script>/g, '');
      (P.page.match(/<script[\s\S]*?<\/script>/g) || []).forEach((s) => { const el = document.createElement('script'); el.textContent = s.replace(/^<script[^>]*>/, '').replace(/<\/script>$/, ''); root.appendChild(el); });
    } catch (e) { gate.hidden = false; msg.textContent = 'Не вдалося розшифрувати дані. Відкрий повне посилання від Світлани ще раз.'; return; }
    root.hidden = false; document.getElementById('wn-refresh').hidden = false; if (window.__fire) window.__fire();
  }
  async function hardRefresh() {
    try { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map((r) => r.unregister())); const ks = await caches.keys(); await Promise.all(ks.map((k) => caches.delete(k))); } catch (e) {}
    location.reload();
  }
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 3 * 60 * 1000 && document.getElementById('dash-root').hidden === false) hardRefresh();
  });
  document.addEventListener('DOMContentLoaded', () => {
    load();
    const rb = document.getElementById('wn-refreshbtn'); if (rb) rb.addEventListener('click', hardRefresh);
    const form = document.getElementById('wn-gateform');
    if (form) form.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = document.getElementById('wn-gatein').value.trim();
      const mm = v.match(/k=([A-Za-z0-9_-]{43})/) || v.match(/^([A-Za-z0-9_-]{43})$/);
      const er = document.getElementById('wn-gateerr');
      if (!mm) { er.hidden = false; return; }
      er.hidden = true; key = mm[1]; store.set('wn-key', key);
      document.getElementById('wn-gate').hidden = true; load();
    });
  });
  addEventListener('resize', () => { clearTimeout(window.__t); window.__t = setTimeout(() => window.__fire && window.__fire(), 120); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
<div id="wn-gate" hidden>
  <img src="icons/icon-180.png" alt="" width="84" height="84" style="border-radius:20px;margin:0 auto 14px;display:block">
  <h1>Warsaw Nest</h1>
  <p id="wn-gatemsg">Встав посилання, яке дала Світлана. Це треба зробити один раз, далі воно запам'ятається.</p>
  <form id="wn-gateform" autocomplete="off">
    <input id="wn-gatein" type="text" inputmode="url" placeholder="Встав посилання з ключем" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Посилання з ключем">
    <button type="submit">Відкрити</button>
  </form>
  <p id="wn-gateerr" hidden>Не схоже на повне посилання. Скопіюй його ще раз разом із частиною після знаку #.</p>
</div>
<div id="wn-refresh" hidden><button type="button" id="wn-refreshbtn" aria-label="Оновити дані" title="Оновити">↻</button><span>версія 28.10, 17:25</span></div>
<div id="dash-root" hidden></div>

</body>
</html>
