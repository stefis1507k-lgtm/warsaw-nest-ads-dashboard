# Одноразова ручна перевірка токена Meta (лише читання). Нічого не змінює і не пише в Meta.
# Токен береться з GitHub Secrets (META_TOKEN) і в журнал не виводиться.
# Журнал цього репозиторію публічний, тому тут друкуємо лише «так/ні» і коди відповіді, без назв і цифр.
name: meta-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Перевірка доступу до кабінетів
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse

          token = os.environ["META_TOKEN"]
          base = "https://graph.facebook.com"

          def get(path, params):
              url = base + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      body = json.loads(e.read().decode())
                  except Exception:
                      body = {}
                  return e.code, body

          print("Токен заданий:", bool(token))

          # 1) Потрібний кабінет «Я і Каріша»
          code, data = get("/act_1789094317922925", {"fields": "name,account_status"})
          print("Я і Каріша: код", code, "| назва збігається:", data.get("name") == "Я і Каріша")

          # 2) Статистика за 7 днів (лише чи є доступ; цифри не друкуємо)
          code, data = get("/act_1789094317922925/insights", {"fields": "spend,clicks", "date_preset": "last_7d"})
          print("Статистика Я і Каріша: код", code, "| рядків:", len(data.get("data", [])) if code == 200 else "немає доступу")

          # 3) Чужі кабінети мають бути НЕдоступні (очікуємо код не 200)
          for label, acc in [("Нерухомість Варшава", "1192826442553958"), ("Вагітність", "6880557725396781")]:
              code, data = get("/act_" + acc, {"fields": "name"})
              print(label + ": код", code, "| доступ є:" , code == 200)
          PY
