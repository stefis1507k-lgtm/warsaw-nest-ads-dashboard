<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Warsaw Nest: реклама</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#150d28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Warsaw Nest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{--color-fg:#f5f0ff;--color-bg:#150d28;--font-anthropic-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--font-anthropic-serif:Georgia,serif}
html,body{margin:0;background:#150d28;color:#f5f0ff;font:14px/1.4 var(--font-anthropic-sans);-webkit-tap-highlight-color:transparent}
body{padding:max(10px,env(safe-area-inset-top)) 10px max(14px,env(safe-area-inset-bottom))}
[hidden]{display:none!important}
#wn-gate{max-width:28rem;margin:20vh auto 0;text-align:center;padding:0 16px}
#wn-gate h1{font-size:22px;margin:0 0 10px}
</style>
</head>
<body>
<script>
// Дані шифровані. Ключ із посилання (#k=...) запам'ятовується на цьому пристрої.
(function () {
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  let key = null;
  const m = location.hash.match(/k=([A-Za-z0-9_-]{43})/);
  if (m) { key = m[1]; store.set('wn-key', key); history.replaceState(null, '', location.pathname); } else key = store.get('wn-key');
    const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  let D = {};
  window.dash = {
    data: (id) => ({ status: D[id] ? 'ok' : 'missing', data: D[id] || [] }),
    onData: (f) => { window.__fire = f; f(); },
    colors: ['#4db8ff', '#22d3c5', '#ffc857', '#2ee6a6'], setLink: () => {}, params: () => ({}), setParams: () => {}, resetParams: () => {}
  };
  async function load() {
    const gate = document.getElementById('wn-gate'), root = document.getElementById('dash-root'), msg = document.getElementById('wn-gatemsg');
    if (!key) { gate.hidden = false; return; }
    try {
      const f = await (await fetch('data.enc', { cache: 'no-cache' })).json();
      const raw = b64(f.ct), iv = b64(f.iv);
      const k = await crypto.subtle.importKey('raw', b64(key), 'AES-GCM', false, ['decrypt']);
      const P = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, k, raw)));
      D = P.data;
      root.innerHTML = P.page.replace(/<script[\s\S]*?<\/script>/g, '');
      (P.page.match(/<script[\s\S]*?<\/script>/g) || []).forEach((s) => { const el = document.createElement('script'); el.textContent = s.replace(/^<script[^>]*>/, '').replace(/<\/script>$/, ''); root.appendChild(el); });
    } catch (e) { gate.hidden = false; msg.textContent = 'Не вдалося розшифрувати дані. Відкрий повне посилання від Світлани ще раз.'; return; }
    root.hidden = false; if (window.__fire) window.__fire();
  }
  document.addEventListener('DOMContentLoaded', load);
  addEventListener('resize', () => { clearTimeout(window.__t); window.__t = setTimeout(() => window.__fire && window.__fire(), 120); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
<div id="wn-gate" hidden><h1>Warsaw Nest</h1><p id="wn-gatemsg">Відкрий повне посилання, яке дала Світлана (з ключем після знаку #).</p></div>
<div id="dash-root" hidden></div>

</body>
</html>
